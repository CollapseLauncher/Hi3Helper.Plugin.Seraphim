name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - 'main' # The 'main' branch

jobs:
  qodana-and-build:
    runs-on: windows-latest
    permissions:
        actions: read
        contents: write
        pull-requests: write
        checks: write
        security-events: write
    env:
      DOTNET_VERSION: '10.0.1xx'
      DOTNET_QUALITY: 'ga'
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Build using O1 config
        run: |
          .\CompileAOTAndShip.bat 1 

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hi3Helper.Plugin.HBR_${{ github.sha }}
          path: .\Hi3Helper.Plugin.HBR\publish\Release\*.zip
          compression-level: 0 # why zipping a zip that is zipped as brotli ?
